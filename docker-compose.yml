services:
  app:
    build: .
    image: modern-chat
    ports:
      - "3000:3000"
    # Server side only: the browser never receives these values.
    env_file:
      - .env.local
    environment:
      PORT: "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s